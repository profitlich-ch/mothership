<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="view-shelf" class="view">
      <div class="head">
        <img class="logo on-dark" src="icons/skull-dark.svg" alt="" />
        <img class="logo on-light" src="icons/skull-light.svg" alt="" />
        <span class="title">Mothership</span>
        <div id="btn-settings" class="ghost"></div>
      </div>

      <div id="settings" class="box hidden">
        <span id="label-api-key" class="label"></span>
        <input id="api-key" type="password" placeholder="sk-ant-…" />
        <div class="field">
          <span id="label-model" class="label"></span>
          <select id="model"></select>
        </div>
        <div class="actions">
          <sp-button id="btn-save-settings" variant="primary"></sp-button>
        </div>
        <div id="label-folder" class="label"></div>
        <div id="folder-path" class="path"></div>
        <div class="actions">
          <div id="btn-reset-folder" class="ghost"></div>
          <div id="btn-choose-folder" class="ghost"></div>
        </div>
      </div>

      <div id="tool-list" class="list"></div>

      <div class="composer">
        <textarea id="prompt"></textarea>
        <div class="actions">
          <sp-button id="btn-create" variant="cta"></sp-button>
        </div>
      </div>
      <div id="shelf-status" class="status"></div>
    </div>

    <div id="view-tool" class="view hidden">
      <div class="head">
        <div id="btn-back" class="ghost"></div>
        <span id="tool-name" class="title"></span>
        <div id="btn-log" class="ghost"></div>
        <div id="btn-reload" class="ghost"></div>
      </div>

      <div id="stage" class="stage"></div>
      <div id="log" class="list hidden"></div>

      <div class="composer">
        <textarea id="change"></textarea>
        <div class="actions">
          <sp-button id="btn-change" variant="primary"></sp-button>
        </div>
      </div>
      <div id="tool-status" class="status"></div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
